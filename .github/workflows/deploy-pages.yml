name: Deploy FoodieHub to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        run: npm install --no-audit --no-fund

      - name: Check source and menu data
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node -e "JSON.parse(require('fs').readFileSync('data/menu.json', 'utf8'))"

      - name: Run backend tests
        run: npm test

      - name: Prepare FoodieHub website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets _site/data
          cp index.html _site/
          cp FoodieHub_Logo_Dark.svg FoodieHub_Logo_Light.svg FoodieHub_Logo_Icon.svg _site/
          cp -R assets/css assets/js _site/assets/
          cp data/menu.json _site/data/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/css/styles.css
          test -s _site/assets/css/apple-ui.css
          test -s _site/assets/js/app.js
          test -s _site/assets/js/config.js
          test -s _site/data/menu.json

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  mobile-qa:
    name: Mobile browser QA (Android sizes)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated Playwright browser runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/foodiehub-mobile-qa
          cd /tmp/foodiehub-mobile-qa
          npm init -y
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Test live site at Android viewport sizes
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/foodiehub-mobile-qa/node_modules/playwright
          FOODIEHUB_QA_URL: https://shagun299.github.io/fodie/?qa=mobile
        run: node scripts/mobile-smoke-test.cjs

      - name: Upload mobile screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foodiehub-mobile-qa-${{ github.run_number }}
          path: mobile-qa-artifacts/
          if-no-files-found: warn
