name: Temporary live backend API probe

on:
  push:
    branches:
      - qa/live-backend-probe

permissions:
  contents: read

jobs:
  verify-live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production FoodieHub API
        shell: bash
        run: |
          node <<'NODE'
          const BASE = "https://foodiehub-api-iv85.onrender.com";
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function getJson(path) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 20000);
            try {
              const response = await fetch(BASE + path, {
                headers: { accept: "application/json" },
                signal: controller.signal
              });
              const contentType = response.headers.get("content-type") || "";
              const bodyText = await response.text();
              let body;
              try { body = JSON.parse(bodyText); }
              catch { throw new Error(path + " returned non-JSON (HTTP " + response.status + "): " + bodyText.slice(0, 180)); }
              if (!response.ok) throw new Error(path + " returned HTTP " + response.status + ": " + JSON.stringify(body).slice(0, 180));
              if (!contentType.includes("application/json")) throw new Error(path + " did not return JSON content-type: " + contentType);
              return body;
            } finally {
              clearTimeout(timer);
            }
          }

          async function main() {
            let health;
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                health = await getJson("/api/health");
                break;
              } catch (error) {
                lastError = error;
                console.log("Health attempt " + attempt + "/12: " + error.message);
                if (attempt < 12) await sleep(5000);
              }
            }
            if (!health) throw lastError || new Error("Health endpoint unavailable.");
            if (health.ok !== true) throw new Error("Health endpoint did not report ok=true.");
            if (health.database !== "connected") throw new Error("Database is not reported connected.");
            if (health.transactionDatabase !== "postgres") throw new Error("Expected Neon PostgreSQL, got " + health.transactionDatabase);
            if (!Number.isInteger(health.menuItems) || health.menuItems < 1) throw new Error("Health reports no menu items.");

            const [menu, categoryData] = await Promise.all([
              getJson("/api/menu"),
              getJson("/api/categories")
            ]);
            if (!Array.isArray(menu.items) || menu.items.length < 1) throw new Error("Menu items array is empty or missing.");
            if (menu.count !== menu.items.length) throw new Error("Menu count does not match the returned item count.");
            if (!Array.isArray(categoryData.categories) || categoryData.categories.length < 1) throw new Error("Categories array is empty or missing.");
            const menuCategories = new Set(menu.items.map(item => item.category));
            const missingCategories = categoryData.categories.filter(category => !menuCategories.has(category));
            if (missingCategories.length) throw new Error("Categories absent from menu response: " + missingCategories.join(", "));
            const invalidItems = menu.items.filter(item =>
              !item.id || !item.name || !Number.isFinite(Number(item.price)) || Number(item.price) <= 0
            );
            if (invalidItems.length) throw new Error("Invalid menu records: " + invalidItems.length);

            console.log(JSON.stringify({
              result: "PASS",
              health: {
                ok: health.ok,
                service: health.service,
                database: health.database,
                transactionDatabase: health.transactionDatabase,
                menuItems: health.menuItems
              },
              menu: { http: 200, count: menu.count, validItems: menu.items.length },
              categories: { http: 200, count: categoryData.categories.length, values: categoryData.categories },
              checkedAt: new Date().toISOString()
            }, null, 2));
          }

          main().catch(error => {
            console.error("LIVE API PROBE FAILED:", error.stack || error.message);
            process.exitCode = 1;
          });
          NODE
